# Beat Station auto-build: compiles the standalone app and the VST3 on
# Windows, macOS and Linux, and attaches them to the run as downloads.
# Push the code (or press "Run workflow" in the Actions tab) and download
# the finished files. Built on JUCE 7.0.12 so the Windows build runs on
# Windows 8.1 and up.
name: Build Beat Station

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows
          - os: macos-15
            name: macOS
          - os: ubuntu-24.04
            name: Linux

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev \
            libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Pin CMake 3.31 on macOS
        if: runner.os == 'macOS'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/BeatStation_artefacts/Release/Standalone/Beat Station.exe" dist/
          Copy-Item -Recurse "build/BeatStation_artefacts/Release/VST3/Beat Station.vst3" dist/
          Compress-Archive -Path dist/* -DestinationPath BeatStation-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R "build/BeatStation_artefacts/Release/Standalone/Beat Station.app" dist/ || true
          cp -R "build/BeatStation_artefacts/Release/VST3/Beat Station.vst3" dist/ || true
          cd dist && zip -r ../BeatStation-macOS.zip . && cd ..

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "build/BeatStation_artefacts/Release/Standalone/Beat Station" dist/ || true
          cp -R "build/BeatStation_artefacts/Release/VST3/Beat Station.vst3" dist/ || true
          cd dist && zip -r ../BeatStation-Linux.zip . && cd ..

      - name: Upload finished files
        uses: actions/upload-artifact@v4
        with:
          name: BeatStation-${{ matrix.name }}
          path: BeatStation-*.zip
          if-no-files-found: warn
